# LuxeMail: Tech.LuxeDealers' own email automation (Cloudflare Worker + D1 + Resend).
name = "luxemail-tech"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "luxemail-tech"
database_id = "6acb20bf-df20-403d-991d-e7ae0512c8b0"

[triggers]
# Every 30 minutes: process reminders and drain the outbox. Daily and fortnightly jobs gate themselves on time.
crons = ["*/30 * * * *"]

[vars]
SHOP_DOMAIN = "vyc3tw-gf.myshopify.com"
STORE_URL = "https://tech.luxedealers.com"
# Set after the first deploy to the Worker's address, e.g. https://luxemail-tech.<account>.workers.dev
PUBLIC_URL = "https://luxemail-tech.turbozzgeezzz.workers.dev"
BRAND = "Tech.LuxeDealers"
FROM_EMAIL = "Tech.LuxeDealers <hello@send.tech.luxedealers.com>"
REPLY_TO = "support@luxedealers.com"
ADMIN_EMAIL = "support@luxedealers.com"
TIMEZONE_OFFSET_HOURS = "10"
DAILY_SEND_LIMIT = "95"
SHOPIFY_API_VERSION = "2025-10"
# VIP and win-back come from LuxeMail's own order history (verified orders from the custom pixel).
VIP_SPEND_CENTS = "25000"
LAPSED_DAYS = "60"

# Secrets (set with `wrangler secret put NAME`):
# SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET, RESEND_API_KEY, UNSUB_SECRET
